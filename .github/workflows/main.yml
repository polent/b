on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  # Cancel superseded PR runs. Never cancel a deploy mid mirror.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Build and check site
      run: npm test

    - name: Install lftp
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

    # Mirror _site to the server over SFTP. Uploads changed files first,
    # then deletes remote files that are no longer in _site.
    # Excluded paths live only on the server and are never touched.
    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        SFTP_USER: ${{ secrets.FTP_USERNAME }}
        SFTP_HOST: ${{ secrets.FTP_SERVER }}
        SFTP_PORT: ${{ secrets.FTP_PORT }}
        LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        MIRROR="mirror --reverse --delete --parallel=4 --verbose"
        MIRROR="$MIRROR --exclude-glob .htaccess --exclude-glob .htpasswd --exclude ^\.well-known/"
        lftp --env-password -u "$SFTP_USER" -p "$SFTP_PORT" \
          -e "set sftp:auto-confirm yes; set net:max-retries 3; $MIRROR ./_site/ /; bye" \
          "sftp://$SFTP_HOST"
